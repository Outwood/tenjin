# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2.1

orbs:
  node: circleci/node@6

commands:
  shared_steps:
    steps:
      - checkout

      - run:
          name: Configure bundler
          command: |
            echo 'export BUNDLER_VERSION=$(cat Gemfile.lock | tail -1 | tr -d " ")' >> $BASH_ENV
            source $BASH_ENV
            gem install bundler
      - restore_cache:
          name: Restore bundle cache
          keys:
            - tenjin-bundle-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - tenjin-bundle-{{ arch }}-
      - run: |
          bundle config set --local path vendor/bundle
          bundle config set --local clean true
          bundle install --jobs=4 --retry=3
      - node/install:
          node-version: "22.21.1"
      - save_cache:
          name: Store bundle cache
          key: tenjin-bundle-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # Corepack runs bin/pnpm.cjs, which pnpm 12 no longer ships
      - run:
          name: Install pnpm
          command: |
            npm install -g "$(node -p 'require("./package.json").packageManager.split("+")[0]')"
      - restore_cache:
          name: Restore pnpm store
          keys:
            - tenjin-pnpm-{{ checksum "pnpm-lock.yaml" }}
            - tenjin-pnpm-
      - run: pnpm install --frozen-lockfile
      - save_cache:
          name: Store pnpm store
          key: tenjin-pnpm-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

default_job: &default_job
  working_directory: ~/tenjin

jobs:
  checks:
    <<: *default_job
    docker:
      - image: cimg/ruby:3.4.9-browsers
        environment:
          RAILS_ENV: test
    steps:
      - shared_steps
      - run:
          name: standardrb (ruby lint)
          command: bundle exec standardrb
      - run:
          name: slim-lint (view lint)
          command: bundle exec slim-lint app/views
      - run:
          name: eslint + prettier (js lint)
          command: pnpm lint
      - run:
          name: jest (js tests)
          command: pnpm test:js

  test:
    <<: *default_job
    parallelism: 2
    docker:
      - image: cimg/ruby:3.4.9-browsers
        environment:
          PGUSER: root
          PGHOST: 127.0.0.1
          RAILS_ENV: test
      - image: cimg/postgres:18.6
        environment:
          POSTGRES_USER: root

    steps:
      - shared_steps
      # Shakapacker skips the compile when the digest in tmp/shakapacker matches
      # its watched files, so a cache keyed on those same inputs turns the step
      # into a no-op. No fallback key: a partial hit still compiles from scratch.
      - run:
          name: Checksum webpack inputs
          command: |
            mkdir -p tmp
            find app/javascript config/webpack config/shakapacker.yml package.json pnpm-lock.yaml -type f \
              | sort | xargs sha256sum | sha256sum > tmp/packs-checksum
      - restore_cache:
          name: Restore compiled test packs
          keys:
            - tenjin-packs-{{ arch }}-{{ checksum "tmp/packs-checksum" }}
      - run:
          name: precompile assets
          command: |
            bin/rails shakapacker:compile
      - save_cache:
          name: Store compiled test packs
          key: tenjin-packs-{{ arch }}-{{ checksum "tmp/packs-checksum" }}
          paths:
            - public/packs-test
            - tmp/shakapacker

      # Wait for DB
      - run: dockerize -wait tcp://localhost:5432 -timeout 1m

      # Database setup
      - run: bin/rails db:create db:schema:load

      # run tests!
      - run:
          name: run tests
          command: |
            mkdir /tmp/test-results
            TEST_FILES="$(circleci tests glob "spec/**/*_spec.rb" | \
              circleci tests split --split-by=timings)"
            bundle exec rspec \
              --format progress \
              --format RspecJunitFormatter \
              --out /tmp/test-results/rspec.xml \
              --format progress \
              $TEST_FILES
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results
      - store_artifacts:
          path: /home/circleci/tenjin/tmp/screenshots/
          destination: browser-screenshots

  # Runs weekly (see weekly_security workflow), not on every push, so newly
  # disclosed gem CVEs surface even when the code hasn't changed.
  security:
    <<: *default_job
    docker:
      - image: cimg/ruby:3.4.9-browsers
        environment:
          RAILS_ENV: test
    steps:
      - shared_steps
      # Static analysis is informational: store the report but never fail the
      # job on a warning (e.g. the standing Rails-EOL notice).
      - run:
          name: brakeman (static analysis report)
          command: |
            mkdir -p tmp/brakeman
            bundle exec brakeman -q --no-pager --no-exit-on-warn \
              -o tmp/brakeman/report.html -o /dev/stdout
      - store_artifacts:
          path: tmp/brakeman
          destination: brakeman
      # The teeth: fail the job on any known gem vulnerability.
      - run:
          name: bundler-audit (gem CVEs)
          command: bundle exec bundle-audit check --update

workflows:
  build_and_test:
    jobs:
      - checks
      - test

  weekly_security:
    triggers:
      - schedule:
          cron: "0 6 * * 1"
          filters:
            branches:
              only: main
    jobs:
      - security
